name: CO-002 Verification

on:
  push:
    branches:
      - feat/co-002-execution-round-trip
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CO-002 tests
        run: python -m unittest discover -s 03_Modules/YOS_Execution/tests -v

      - name: Run CO-001 regression tests
        run: python -m unittest discover -s 03_Modules/YOS_Memory/tests -v

      - name: Validate CO-002 JSON schema syntax
        run: python -m json.tool 03_Modules/YOS_Execution/schemas/execution_canonical_profiles.schema.json >/dev/null
